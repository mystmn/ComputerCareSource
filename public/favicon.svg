<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <!-- Rounded Navy App Icon Tile -->
  <rect width="140" height="140" rx="32" fill="#132338" />

  <!-- House Emblem (Centered Top) -->
  <g transform="translate(14, 12)">
    <!-- Roof with Chimney -->
    <!-- Chimney on left slope -->
    <path d="M26 38V18H38V27.5L26 38Z" fill="#0C2548" />

    <!-- Gable Roof Outline & Peak -->
    <path d="M56 6L6 43H18L56 14L94 43H106L56 6Z" fill="#0C2548" />

    <!-- Golden Gable Triangular Facet (Split Shading) -->
    <!-- Left Shaded Facet -->
    <path d="M56 16L22 41H56V16Z" fill="#B46C2A" />
    <!-- Right Bright Facet -->
    <path d="M56 16V41H90L56 16Z" fill="#D8A242" />

    <!-- Left & Right Gold Wall Pillars -->
    <rect x="22" y="41" width="10" height="34" fill="#B46C2A" />
    <rect x="80" y="41" width="10" height="34" fill="#D8A242" />

    <!-- Laptop Base -->
    <path d="M18 75C18 73.5 19.5 72 21 72H91C92.5 72 94 73.5 94 75L97 81H15L18 75Z" fill="#0C2548" />
    <!-- Trackpad accent notch -->
    <rect x="50" y="74" width="12" height="2" rx="1" fill="#718096" />

    <!-- Laptop Screen Outer (Teal Border) -->
    <rect x="30" y="38" width="52" height="34" rx="2" fill="#0C6C84" />
    <!-- Laptop Screen Inner (White) -->
    <rect x="33" y="41" width="46" height="28" rx="1" fill="#FFFFFF" />

    <!-- Golden Checkmark (Swooshing out through right side) -->
    <path d="M42 56L51 65L86 30L90 34L51 73L38 60L42 56Z" fill="#D8A242" stroke="#B46C2A" stroke-width="0.5" />
  </g>

  <!-- CCS Letters (Bold White Centered Below) -->
  <text
    x="70"
    y="118"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="1.5"
    fill="#FFFFFF"
  >CCS</text>
</svg>
